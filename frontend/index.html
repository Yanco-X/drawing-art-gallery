<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/brand/favicon-32.png" sizes="32x32" />
    <link rel="icon" href="/brand/favicon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/brand/favicon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Unlisted, not private. noindex rather than a robots.txt disallow:
         a disallow does not de-index, and blocking the fetch stops the
         crawler from ever seeing the tag that would. See context/AUTH.md. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>YanCurations</title>
    <!-- Link previews. Static on purpose: the preview fetchers do not run
         JavaScript, so tags set by React would never be seen. -->
    <meta name="description" content="Drawings, kept quietly in one place." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="YanCurations" />
    <meta property="og:title" content="YanCurations" />
    <meta property="og:description" content="Drawings, kept quietly in one place." />
    <meta property="og:url" content="https://yancurations.com/" />
    <meta property="og:image" content="https://yancurations.com/brand/preview.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
