<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Unlisted, not private. noindex rather than a robots.txt disallow:
         a disallow does not de-index, and blocking the fetch stops the
         crawler from ever seeing the tag that would. See context/AUTH.md. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>SketchyArt Gallery</title>
    <!-- Google Fonts: Instrument Serif (display) + Instrument Sans (UI).
         Self-host these before production. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Stamp the theme before first paint so there is no flash of the
      // wrong palette. Mirrors ThemeProvider's resolution order:
      // stored choice, then OS preference, then dark.
      (function () {
        try {
          var stored = localStorage.getItem('sketchyart-theme');
          if (stored !== 'dark' && stored !== 'light') {
            stored = window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          }
          document.documentElement.setAttribute('data-theme', stored);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
