# Credentials come from backend/.env, which compose reads for ${...}.
services:
  db:
    image: postgres:17-alpine
    container_name: sketchyart-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sketchyart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: sketchyart
    # 127.0.0.1: reachable from this machine only, never from the LAN.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sketchyart-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sketchyart -d sketchyart"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage, so the phase 2 code path can be developed
  # and exercised locally. Speaks the real S3 protocol -- the same boto3 code
  # runs unchanged against AWS S3, Cloudflare R2, or Backblaze.
  #   API:     http://localhost:9000
  #   Console: http://localhost:9001  (S3_ACCESS_KEY / S3_SECRET_KEY from .env)
  minio:
    image: minio/minio
    container_name: sketchyart-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in backend/.env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in backend/.env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - sketchyart-minio:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sketchyart-pgdata:
  sketchyart-minio:
